<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" id="app-favicon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="Hostel Management System with role-based access for students and wardens." />
    <title>Hostel Management System</title>
    <script>
      (function() {
        const testImg = new Image();
        testImg.onload = function() {
          const icon = document.getElementById('app-favicon');
          if (icon) {
            icon.type = 'image/png';
            icon.href = '/logo.png';
          }
        };
        testImg.src = '/logo.png';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
